<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jax demo</title>
    <style>
      :root {
        --bg: #0f0d0c;
        --panel: #1a1614;
        --line: #2e2723;
        --text: #f5f1ed;
        --muted: #9a918a;
        --amber: #ffb454;
        --crimson: #e25d75;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px 72px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 4px 0 0;
        color: var(--muted);
      }
      .controls,
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button,
      select {
        font: inherit;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
      }
      button:hover {
        border-color: var(--amber);
      }
      button[aria-pressed='true'],
      button[aria-current='true'] {
        background: var(--amber);
        color: #1a1210;
        border-color: var(--amber);
      }
      .stage {
        display: grid;
        place-items: center;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background:
          radial-gradient(ellipse 60% 45% at 50% 82%, rgb(255 170 64 / 22%), transparent 70%),
          radial-gradient(ellipse 50% 40% at 18% 12%, rgb(167 139 250 / 14%), transparent 70%),
          #0c0b0a;
        max-width: 100%;
        overflow: hidden;
      }
      .readout {
        font-variant-numeric: tabular-nums;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }
      .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--muted);
        cursor: pointer;
      }
      .tile:hover {
        border-color: var(--crimson);
      }
      .tile canvas,
      .tile svg {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Jax</h1>
        <p>The Liminal HQ otter, as a small 3D companion. Pick a mood, or let him drift.</p>
      </header>
      <div class="controls" id="controls"></div>
      <p class="readout" id="smoothness" aria-live="off">Smoothness: measuring…</p>
      <div class="chips" id="chips"></div>
      <div class="stage" id="hero"></div>
      <div class="grid" id="grid"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
